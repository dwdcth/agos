[package]
name = "agent-memos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first cognitive memory kernel for agents."
rust-version = "1.97.1"

[[bin]]
name = "agent-memos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
libsimple = { version = "0.10", optional = true }
rig-core = { version = "0.46", default-features = false }
rig-reqwest = "0.46"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
sqlite-vec = "0.1.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["chinese-tokenizer"]
chinese-tokenizer = ["dep:libsimple"]
